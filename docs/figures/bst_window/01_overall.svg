   <g id="text_3">
    <text style="fill: #526272; font: 9.4px 'DejaVu Sans'" transform="translate(29.592 592.99627)">Old observations remain available after commitment; time grouping does not assert independent windows.</text>
    <text style="fill: #526272; font: 9.4px 'DejaVu Sans'" transform="translate(29.592 603.522214)">Age-zero control: run SDU once at admission, then commit before later-window evidence.</text>
   </g>
   <g id="text_4">
    <text style="fill: #213547; font: 700 10.4px 'DejaVu Sans'; text-anchor: middle" x="92.448" y="142.875175" transform="rotate(-0 92.448 142.875175)">Events</text>
   </g>
   <g id="text_5">
    <text style="fill: #213547; font: 9.8px 'DejaVu Sans'; text-anchor: middle" x="92.448" y="176.601147" transform="rotate(-0 92.448 176.601147)">x, y, t, polarity</text>
   </g>
   <g id="text_6">
    <text style="fill: #213547; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="293.238" y="128.913637" transform="rotate(-0 293.238 128.913637)">BIR backbone</text>
   </g>
   <g id="text_7">
    <text style="fill: #213547; font: 9.4px 'DejaVu Sans'" transform="translate(243.179328 170.334984)">50 ms shared update</text>
    <text style="fill: #213547; font: 9.4px 'DejaVu Sans'" transform="translate(221.190672 182.646561)">Bounded state / event readout</text>
   </g>
   <g id="text_8">
    <text style="fill: #213547; font: 700 10.4px 'DejaVu Sans'; text-anchor: middle" x="518.472" y="142.875175" transform="rotate(-0 518.472 142.875175)">Initial belief</text>
