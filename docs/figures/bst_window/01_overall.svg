    <text style="fill: #213547; font: 9.4px 'DejaVu Sans'" transform="translate(967.320531 170.334984)">Event label / score</text>
    <text style="fill: #213547; font: 9.4px 'DejaVu Sans'" transform="translate(980.269766 182.646561)">Commit time</text>
   </g>
   <g id="text_14">
    <text style="fill: #213547; font: 700 10.3px 'DejaVu Sans'; text-anchor: middle" x="141.336" y="381.807191" transform="rotate(-0 141.336 381.807191)">Shared source bank</text>
   </g>
   <g id="text_15">
    <text style="fill: #213547; font: 9.7px 'DejaVu Sans'" transform="translate(79.383312 425.070655)">Encode each source once</text>
    <text style="fill: #213547; font: 9.7px 'DejaVu Sans'" transform="translate(70.945828 437.775154)">Retain source ID and window</text>
    <text style="fill: #213547; font: 9.7px 'DejaVu Sans'" transform="translate(78.526984 450.479653)">Cache fixed relations only</text>
   </g>
   <g id="text_16">
    <text style="fill: #213547; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="539.424" y="382.339081" transform="rotate(-0 539.424 382.339081)">SDU: re-audit old observations</text>
   </g>
   <g id="text_17">
    <text style="fill: #213547; font: 10.4px 'DejaVu Sans'" transform="translate(445.499 424.346991)">Within-window normalized evidence</text>
    <text style="fill: #213547; font: 10.4px 'DejaVu Sans'" transform="translate(433.790062 437.96831)">Across-window discounted accumulation</text>
    <text style="fill: #213547; font: 10.4px 'DejaVu Sans'" transform="translate(447.02975 451.589629)">Prior + recomputed total correction</text>
   </g>
   <g id="text_18">
