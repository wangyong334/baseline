    <text style="fill: #213547; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="741.96" y="128.913637" transform="rotate(-0 741.96 128.913637)">Birth decision</text>
   </g>
   <g id="text_11">
    <text style="fill: #213547; font: 9.4px 'DejaVu Sans'" transform="translate(691.170625 170.334984)">Fixed band by default</text>
    <text style="fill: #213547; font: 9.4px 'DejaVu Sans'" transform="translate(680.941516 182.646561)">Optional cheap value MLP</text>
   </g>
   <g id="text_12">
    <text style="fill: #213547; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="1010.844" y="128.913637" transform="rotate(-0 1010.844 128.913637)">Commit</text>
   </g>
