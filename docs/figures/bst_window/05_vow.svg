   <g id="text_3">
    <text style="fill: #526272; font: 9.4px 'DejaVu Sans'; text-anchor: start" x="29.592" y="604.205094" transform="rotate(-0 29.592 604.205094)">Model-based risk is not a guaranteed error bound. Current action cost is explicit; future costs are included in the learned return.</text>
   </g>
   <g id="text_4">
    <text style="fill: #213547; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="144.828" y="170.266359" transform="rotate(-0 144.828 170.266359)">Causal SDU state</text>
   </g>
   <g id="text_5">
    <text style="fill: #213547; font: 9.9px 'DejaVu Sans'" transform="translate(87.907641 211.80947)">Current belief / change</text>
    <text style="fill: #213547; font: 9.9px 'DejaVu Sans'" transform="translate(64.102781 224.775917)">Window-level evidence statistics</text>
    <text style="fill: #213547; font: 9.9px 'DejaVu Sans'" transform="translate(85.535508 237.742365)">Age / remaining horizon</text>
    <text style="fill: #213547; font: 9.9px 'DejaVu Sans'" transform="translate(83.981672 250.708813)">No future labels as input</text>
   </g>
   <g id="text_6">
    <text style="fill: #213547; font: 700 10.7px 'DejaVu Sans'; text-anchor: middle" x="462.6" y="126.031128" transform="rotate(-0 462.6 126.031128)">Stop branch: analytic risk</text>
   </g>
   <g id="text_7">
    <!-- $R_s=\min[c_{FN}p,c_{FP}(1-p)]$ -->
    <g style="fill: #213547" transform="translate(400.384 161.524262)">
     <text>
      <tspan style="font: oblique 10.1px 'DejaVu Sans'" x="0 46.473199 61.691888 73.30993 110.321594" y="-0.40625">Rcpcp</tspan>
      <tspan style="font: oblique 7.07px 'DejaVu Sans'" x="7.035095 52.039972 56.116669 78.876703 82.9534" y="1.234375">sFNFP</tspan>
      <tspan style="font: 10.1px 'DejaVu Sans'" x="12.973688 23.429926 33.292902 36.105951 42.523065 68.11889 87.500793 91.450928 99.865356 116.748596 120.69873" y="-0.40625">=min[,(1−)]</tspan>
     </text>
    </g>
    <text style="fill: #213547; font: 10.1px 'DejaVu Sans'" transform="translate(378.863109 174.773174)">Costs match the report threshold</text>
   </g>
   <g id="text_8">
    <text style="fill: #213547; font: 700 10.4px 'DejaVu Sans'; text-anchor: middle" x="462.6" y="313.595175" transform="rotate(-0 462.6 313.595175)">Wait branch: conditional return</text>
   </g>
   <g id="text_9">
    <text style="fill: #213547; font: 9.8px 'DejaVu Sans'" transform="translate(387.15225 348.804247)">Linear - SiLU - Linear - Softplus</text>
    <!-- $f_\theta(S_d)\approx\mathbb{E}[J_{d+1}^{\pi}\mid S_d]$ -->
    <g style="fill: #213547" transform="translate(416.491 361.926141)">
     <text>
      <tspan style="font: oblique 9.8px 'DejaVu Sans'" x="0 11.685413 48.286517 77.162018" y="-0.234375">fSJS</tspan>
      <tspan style="font: oblique 6.86px 'DejaVu Sans'" x="3.432495 17.874377 51.162006 51.864558 83.350983" y="1.40625 1.40625 2.5 -4.171875 1.40625">θddπd</tspan>
      <tspan style="font: 9.8px 'DejaVu Sans'" x="7.88158 22.48009 28.183459 44.482684 70.387482 87.956696" y="-0.234375">()≈[∣]</tspan>
      <tspan style="font: italic 9.8px 'STIXNonUnicode'" x="38.252429" y="-0.234375"></tspan>
      <tspan style="font: 6.86px 'DejaVu Sans'" x="56.823956 63.872235" y="2.5">+1</tspan>
     </text>
    </g>
    <!-- $Q_w=c_{step}+f_\theta(S_d)$ -->
    <g style="fill: #213547" transform="translate(420.313 375.567741)">
     <text>
      <tspan style="font: oblique 9.8px 'DejaVu Sans'" x="0 25.49823 57.863831 69.549243" y="-0.40625">QcfS</tspan>
      <tspan style="font: oblique 6.86px 'DejaVu Sans'" x="7.674316 30.858826 34.414624 37.090637 41.289612 61.296326 75.738208" y="1.234375">wstepθd</tspan>
      <tspan style="font: 9.8px 'DejaVu Sans'" x="15.42926 47.794861 65.74541 80.343921" y="-0.40625">=+()</tspan>
     </text>
    </g>
   </g>
   <g id="text_10">
    <text style="fill: #213547; font: 700 10.6px 'DejaVu Sans'; text-anchor: middle" x="759.42" y="183.999944" transform="rotate(-0 759.42 183.999944)">Compare</text>
   </g>
   <g id="text_11">
    <!-- $Q_w&lt;R_s$? -->
    <g style="fill: #213547" transform="translate(738.22 231.566824)">
     <text>
      <tspan style="font: oblique 10px 'DejaVu Sans'" x="0 26.14502" y="-0.578125">QR</tspan>
      <tspan style="font: oblique 7px 'DejaVu Sans'" x="7.871094 33.093262" y="1.0625">ws</tspan>
      <tspan style="font: 10px 'DejaVu Sans'" x="15.817871 37.013672" y="-0.578125">&lt;?</tspan>
     </text>
    </g>
    <text style="fill: #213547; font: 10px 'DejaVu Sans'" transform="translate(712.279375 244.664246)">Deadline overrides</text>
   </g>
   <g id="text_12">
    <text style="fill: #213547; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="1002.114" y="139.156837" transform="rotate(-0 1002.114 139.156837)">Commit</text>
   </g>
   <g id="text_13">
    <text style="fill: #213547; font: 9.4px 'DejaVu Sans'; text-anchor: middle" x="1002.114" y="174.783572" transform="rotate(-0 1002.114 174.783572)">Remove query state</text>
   </g>
   <g id="text_14">
    <text style="fill: #213547; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="1002.114" y="313.291237" transform="rotate(-0 1002.114 313.291237)">Wait</text>
   </g>
   <g id="text_15">
    <text style="fill: #213547; font: 9.4px 'DejaVu Sans'; text-anchor: middle" x="1002.114" y="348.917972" transform="rotate(-0 1002.114 348.917972)">Read next window</text>
   </g>
   <g id="text_16">
    <text style="fill: #213547; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="281.016" y="480.596837" transform="rotate(-0 281.016 480.596837)">Training: frozen-policy returns</text>
   </g>
   <g id="text_17">
    <text style="fill: #213547; font: 9.4px 'DejaVu Sans'" transform="translate(100.317891 516.896584)">Roll out a deployable policy, construct realized returns, fit conditional means</text>
    <text style="fill: #213547; font: 9.4px 'DejaVu Sans'" transform="translate(96.836953 529.208161)">Repeat policy evaluation / improvement; never choose hindsight label minima</text>
   </g>
   <g id="text_18">
    <text style="fill: #213547; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="843.228" y="480.596837" transform="rotate(-0 843.228 480.596837)">Admission happens before costly SDU work</text>
   </g>
   <g id="text_19">
    <text style="fill: #213547; font: 9.4px 'DejaVu Sans'" transform="translate(718.849109 516.896584)">Default: public fixed band; optional cheap birth head</text>
    <text style="fill: #213547; font: 9.4px 'DejaVu Sans'" transform="translate(693.747437 529.208161)">Shared grid statistics + own features predict cost after opening</text>
   </g>
