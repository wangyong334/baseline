   </g>
   <g id="text_18">
    <text style="fill: #203447; font: 700 10.9px 'DejaVu Sans'; text-anchor: middle" x="769.59" y="431.815097" transform="rotate(-0 769.59 431.815097)">Individually addressable rows</text>
   </g>
   <g id="text_19">
    <text style="fill: #203447; font: 10.4px 'DejaVu Sans'" transform="translate(697.972188 475.196194)">Old IDs + newly arrived IDs</text>
    <text style="fill: #203447; font: 10.4px 'DejaVu Sans'" transform="translate(687.665625 489.60775)">No irreversible token averaging</text>
    <text style="fill: #203447; font: 10.4px 'DejaVu Sans'" transform="translate(698.663625 504.019306)">Group identity is preserved</text>
   </g>
   <g id="text_20">
    <text style="fill: #203447; font: 700 10.9px 'DejaVu Sans'; text-anchor: middle" x="1092.6" y="431.815097" transform="rotate(-0 1092.6 431.815097)">SDU re-audit</text>
   </g>
