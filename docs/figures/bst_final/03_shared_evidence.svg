     <text>
      <tspan style="font: 10.4px 'DejaVu Sans'" x="0 7.760986 14.144043 22.629456 25.927368 32.513062 39.088623 45.47168 49.737183 55.877075 59.174988 64.879211 71.226807 77.802368 81.8703 88.253357 94.39325 98.461182" y="-0.703125">New query context </tspan>
