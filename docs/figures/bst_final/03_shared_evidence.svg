    </g>
    <text style="fill: #203447; font: 10.4px 'DejaVu Sans'" transform="translate(1003.513437 489.60775)">Recompute gates + signed values</text>
    <text style="fill: #203447; font: 10.4px 'DejaVu Sans'" transform="translate(1017.906875 504.019306)">Reuse static projections only</text>
   </g>
   <g id="text_22">
    <text style="fill: #203447; font: 700 10.1px 'DejaVu Sans'; text-anchor: middle" x="315.63" y="610.657916" transform="rotate(-0 315.63 610.657916)">Training: geometry/IDs reusable; learned features refresh after optimizer updates.</text>
   </g>
   <g id="text_23">
    <text style="fill: #203447; font: 700 10.1px 'DejaVu Sans'; text-anchor: middle" x="933.714" y="610.657916" transform="rotate(-0 933.714 610.657916)">Online: encode new sources once; append pairs causally; discard expired history.</text>
