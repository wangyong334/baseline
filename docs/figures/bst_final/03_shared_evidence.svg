   </g>
   <g id="text_15">
    <text style="fill: #203447; font: 10.5px 'DejaVu Sans'" transform="translate(107.478352 475.085215)">Pixel / window lookup</text>
    <text style="fill: #203447; font: 10.5px 'DejaVu Sans'" transform="translate(91.607766 489.635344)">Self-exclusion + valid mask</text>
    <text style="fill: #203447; font: 10.5px 'DejaVu Sans'" transform="translate(102.01425 504.185473)">Only available windows</text>
   </g>
   <g id="text_16">
    <text style="fill: #203447; font: 700 10.7px 'DejaVu Sans'; text-anchor: middle" x="458.802" y="431.663128" transform="rotate(-0 458.802 431.663128)">Fixed pair features</text>
   </g>
