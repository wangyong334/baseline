   <g id="text_5">
    <text style="fill: #586c7d; font: 10px 'DejaVu Sans'; text-anchor: start" x="41.508" y="683.952038" transform="rotate(-0 41.508 683.952038)">These are implementation savings with the same selected evidence. A source window is a grouping unit, not a claim of statistical independence.</text>
