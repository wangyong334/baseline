   <g id="text_13">
    <text style="fill: #203447; font: 10.5px 'DejaVu Sans'" transform="translate(995.343797 234.137215)">Original ID + source window</text>
    <text style="fill: #203447; font: 10.5px 'DejaVu Sans'" transform="translate(988.601648 248.687344)">Reuse across queries and ages</text>
    <text style="fill: #203447; font: 10.5px 'DejaVu Sans'" transform="translate(970.878797 263.237473)">Commitment does not erase a source</text>
   </g>
   <g id="text_14">
