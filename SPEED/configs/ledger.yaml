# Provenance of every numeric constant of the system configs (base variant). Categories:
#   physical     property of the sensor or of physics
#   requirement  fixed by the task / benchmark protocol
#   design       capacity or structural choice, scale-free
#   init         initial value of a learned quantity (training moves it)
#   protocol     optimisation / evaluation procedure, not part of the model
#   numerical    implementation detail; does not change the mathematics
#   evuav        chosen or measured on EV-UAV in V1-V3; stage 3 (P4) replaces it by a rule or by adaptation
# Readouts are addressed by kind (readouts.<kind>.<key>).
clock.step_ms: [evuav, "50 ms window of V1-V3; P4 candidate (rule from the scale statistics / adaptive clock)"]
canvas.multiple: [design, "total downsampling of the backbone (3 stride-2 stages)"]
representation.taus_ms: [evuav, "time scales of the moments"]
representation.dipole_taus_ms: [evuav, "subset of taus used for the polarity dipole"]
representation.dipole_radius_px: [evuav, "dipole neighbourhood in pixels (target size on EV-UAV)"]
representation.bg_fast_ms: [evuav, "fast background time constant"]
representation.bg_slow_ms: [evuav, "slow per-pixel background time constant"]
representation.bg_prior_per_px_step: [evuav, "background prior per pixel and step; tied to the step length and the sensor"]
representation.bg_prior_steps: [evuav, "pseudo-count of the prior in steps; cold-start behaviour (P7)"]
representation.bg_floor_per_px_step: [evuav, "floor of the background estimate"]
representation.bg_smooth_radius_px: [evuav, "neighbourhood of the fast background estimate in pixels"]
network.neuron.v_threshold: [design, "firing threshold; scale set by the calibrated gains"]
network.neuron.tau_init_ms: [init, "initial membrane time constant (learned)"]
network.neuron.tau_min_ms: [evuav, "lower bound of tau; equals the 50 ms step"]
network.neuron.tau_max_ms: [evuav, "upper bound of tau"]
network.neuron.u_floor: [evuav, "carried membrane floor in units of v_th (09-23 diagnosis)"]
network.neuron.u_ceil: [evuav, "carried membrane ceiling (unused)"]
network.backbone.channels: [design, "U-Net widths"]
network.heads.hidden: [design, "hidden width of the per-pixel heads"]
network.heads.mark_prior: [init, "bias init = target-event share; rule candidate: training-split share"]
network.heads.intensity_prior_per_px_step: [init, "bias init = target events per pixel and step; rule candidate"]
network.heads.log_g_max: [numerical, "soft cap of the log intensity (overflow guard)"]
verifier.velocities_px_per_step: [evuav, "fixed velocity grid +-4 px/step; P3 (estimated velocity, few hypotheses)"]
verifier.footprint_px: [evuav, "evidence footprint 3x3 px (target size on EV-UAV)"]
verifier.track_tau_ms: [evuav, "time constant of the tube intensity memory"]
verifier.gate_eps: [evuav, "prediction gate for sparse execution (readouts unchanged on EV-UAV)"]
# V4 step 1 (configs/v4/step1_*.yaml): the estimator replaces verifier.velocities_px_per_step (one evuav constant fewer)
verifier.taus_ms: [design, "velocity estimator time scales (E1 A_sel, both training splits; values shared with representation.taus_ms)"]
verifier.radii_px: [design, "velocity estimator box half-widths 4/8/16 px (E1 A_sel, powers of two)"]
verifier.min_weight: [numerical, "minimum weight sum of a velocity fit (E1: 5)"]
readouts.fixed_delay.delays_steps: [protocol, "reported fixed waits"]
readouts.fixed_delay.fusion_weight: [design, "weight of the tube evidence (calibrated value 1)"]
readouts.publish.deadline_steps: [evuav, "longest wait D in steps"]
readouts.publish.theta: [requirement, "null = logit of the benchmark threshold"]
readouts.publish.upper: [evuav, "early-target margin a; P6: derive from an allowed error rate"]
readouts.publish.lower: [evuav, "early-background margin b; P6: derive from an allowed error rate"]
readouts.publish.gate: [design, "attribution gate (off)"]
readouts.publish.fusion_weight: [design, "same weight as the fixed-delay readout"]
loss.mark_weight: [design, "weight of the per-event BCE"]
loss.intensity_weight: [design, "weight of the intensity likelihood"]
loss.intensity_smooth_px: [evuav, "smoothing of the intensity target in pixels"]
training.seed: [protocol, "random seed"]
training.epochs: [protocol, "EV-UAV 50; EV-Flying 15 (same total number of updates)"]
training.lr: [protocol, "Adam learning rate at the first epoch"]
training.lr_end: [protocol, "learning rate at the last epoch (linear)"]
training.tbptt_steps: [protocol, "truncation length of backpropagation through time"]
training.grad_clip: [protocol, "gradient norm clip"]
training.num_workers: [numerical, "data loader workers"]
training.update_steps: [protocol, "continuous recordings: one update per this many steps (= one EV-UAV clip)"]
training.checkpoint_steps: [numerical, "activation recomputation sub-chunk"]
training.calibration.sequences: [protocol, "recordings used for gain calibration"]
training.calibration.steps: [protocol, "steps per calibration recording"]
training.calibration.samples_per_channel: [protocol, "samples kept per channel and step"]
training.calibration.min_positive: [protocol, "fallback to the layer quantile below this count"]
training.calibration.quantile: [protocol, "current quantile mapped to the threshold"]
training.calibration.gain_min: [protocol, "lower clamp of initial gains"]
training.calibration.gain_max: [protocol, "upper clamp of initial gains"]
evaluation.threshold: [requirement, "benchmark decision threshold 0.9"]
evaluation.chunk_steps: [numerical, "steps processed together at inference (results unchanged)"]
evaluation.frame_ms: [requirement, "benchmark Pd / Fa frame (pd_detT = 50 ms)"]
evaluation.correct_thresh: [requirement, "benchmark hit ratio"]
