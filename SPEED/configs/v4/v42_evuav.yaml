# V4-2 on EV-UAV: the V2 / V3 verifier and publishing rule become learned parts trained by what inference does with
# them. Changes to motion_evuav.yaml (v4-1):
#   representation  learnable moment time scales (start at the V2 values) + log mu0 channel (heads only)
#   neuron          ALIF: learnable adaptive threshold (spike-frequency adaptation), starts close to the LIF
#   heads           + background head: next-step background events per pixel = H0 of the verifier
#   readout_head    learned fusion weights w_d, 5 x 5 position weights (start = V2's 3 x 3 mean), stability head
#   verifier        learned evidence: forecasts along 5 sigma points of the learned motion against the learned H0,
#                   learned position mixture, continuous paths, anchored chain; no track memory, no EV-UAV gate
#   readouts        net, learned fused_d1..5, learned wait-safe publishing (pub)
#   loss            + background NLL + evidence BCE (fused scores at delays 1..5) + stability BCE
#   training        + event thinning / time compression; checkpoint selection by the validation IoU of pub
# Memory transport is off (10-09: own problem branch, decided by v4-1's motion vs static and later on EV-Flying).
# Ablations (retrain): network.neuron.kind=lif | loss.evidence_weight=0 | training.augment=null |
#   network.heads.background=false verifier.background=front loss.background_weight=0 | representation.kind=evidence
# Ablation (same weights): --set verifier.background=front (H0 = the front end's mu0, V2's background model)
dataset: evuav

clock:
  kind: fixed
  step_ms: 50

canvas:
  multiple: 8                      # total downsampling of the backbone; sensor size padded bottom / right

representation:
  kind: learned_evidence           # learnable moment time scales (initialised at taus_ms)
  taus_ms: [20, 100, 500, 2000]
  dipole_taus_ms: [100, 500]
  dipole_radius_px: 3
  bg_fast_ms: 500
  bg_slow_ms: 5000
  bg_prior_per_px_step: 0.01
  bg_prior_steps: 2
  bg_floor_per_px_step: 0.001
  bg_smooth_radius_px: 7
  features: [count, ratio, age, dipole, logmu]   # logmu: dense, read by the heads only

network:
  neuron:
    kind: alif                     # adaptive threshold theta = v_th + b a (learned b and adaptation tau)
    v_threshold: 1.0
    tau_init_ms: 200.0
    tau_min_ms: 50.0
    tau_max_ms: 2000.0
    u_floor: -4                    # carried membrane floor, units of v_th
    u_ceil: null
    adapt_init: 0.05
    adapt_tau_init_ms: 500.0
  backbone:
    kind: merged_unet
    channels: [12, 24, 48, 48]
  heads:
    kind: mark_intensity_motion
    hidden: 16
    motion_hidden: 16
    motion_sigma_init_px_per_step: 1.0
    background: true               # log mu = log mu0 + learned correction (H0 of the verifier)
    background_hidden: 8
    mark_prior: 0.03
    intensity_prior_per_px_step: 0.0002
    log_g_max: 8.0
  transport:
    kind: none                     # memory transport is a separate problem branch (P3), not part of v4-2 (10-09)
  readout_head:
    max_delay_steps: 5             # deadline D: latency budget 250 ms
    mixture_radius_px: 2
    stability_hidden: 8

verifier:
  kind: learned_evidence
  background: head                 # head = learned H0; front = the front end's mu0 (ablation)
  cloud_spacing_px_per_step: 1.0
  mu_floor_per_px_step: 0.001      # = representation.bg_floor_per_px_step
  source_gate_per_px_step: 0.001   # forecasts below the background floor are not pushed (sparse execution)
  anchor: true

readouts:
  - kind: net
  - kind: learned_delay
    delays_steps: [1, 2, 3, 4, 5]
  - kind: learned_publish
    theta: null                    # null = logit(evaluation.threshold)
    epsilon: 0.02                  # tolerated rate of early decisions that differ from the deadline decision

loss:
  kind: learned_evidence
  mark_weight: 1.0
  forecast_weight: 1.0
  motion_weight: 1.0
  background_weight: 1.0
  evidence_weight: 1.0
  stability_weight: 1.0
  current_weight: 0.0
  intensity_smooth_px: 3
  forecast_floor_per_px_step: 0.0002

training:
  kind: tbptt
  seed: 37
  epochs: 50
  lr: 0.001
  lr_end: 0.0001
  tbptt_steps: 16
  grad_clip: 1.0
  num_workers: 2
  deterministic: true
  carry: true
  augment:
    keep_min: 0.7                  # event thinning: keep probability ~ U[0.7, 1]
    time_scale_min: 0.7            # time compression: timestamps x s, s ~ log-U[0.7, 1]
  calibration:
    sequences: 8
    steps: 32
    samples_per_channel: 2048
    min_positive: 1024
    quantile: 0.99
    gain_min: 0.05
    gain_max: 20.0

evaluation:
  threshold: 0.9
  chunk_steps: 32
  frame_ms: 50
  correct_thresh: 0.0001
  select_readout: pub              # checkpoint selection by the readout that is reported
  select_metric: iou
