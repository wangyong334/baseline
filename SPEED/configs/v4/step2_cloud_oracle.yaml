# V4 step 1 closure diagnostic: the same cloud (spread, weights) with the label velocity as centre at target events
# (non-causal reference only): tells whether the velocity estimate still limits the cloud.
# Use with tools/infer.py --sections on a base checkpoint (network, representation and readouts unchanged).
verifier:
  kind: measured_motion
  taus_ms: [20, 100, 500]        # estimator time scales (E1 A_sel; same as the representation's traces)
  radii_px: [4, 8, 16]           # estimator box half-widths (E1 A_sel)
  min_weight: 5.0                # minimum weight sum of a fit (E1)
  include_zero: true
  cloud: true
  oracle: true
  cloud_spacing_px_per_step: 1.0  # sigma points at least 1 px/step from the centre (pixel grid over one step)
  zero_weight: adaptive
  footprint_px: 3                # as base
  track_tau_ms: 250              # as base
  gate_eps: 0.03                 # as base
