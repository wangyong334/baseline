# V4-3 on EV-UAV trained jointly from scratch: same model as v43_evuav.yaml, but every new objective (motion, evidence)
# also trains the trunk (heads.detach_trunk false) and the base losses train mark / intensity as in the base.
# The background head never trains the trunk. Compare with v43_evuav.yaml: what protecting the trunk is worth.
dataset: evuav

clock:
  kind: fixed
  step_ms: 50

canvas:
  multiple: 8                      # total downsampling of the backbone; sensor size padded bottom / right

representation:
  kind: evidence
  taus_ms: [20, 100, 500, 2000]
  dipole_taus_ms: [100, 500]
  dipole_radius_px: 3
  bg_fast_ms: 500
  bg_slow_ms: 5000
  bg_prior_per_px_step: 0.01
  bg_prior_steps: 2
  bg_floor_per_px_step: 0.001
  bg_smooth_radius_px: 7
  features: [count, ratio, age, dipole, logmu]   # logmu: dense, read by the heads only

network:
  neuron:
    kind: lif
    v_threshold: 1.0
    tau_init_ms: 200.0
    tau_min_ms: 50.0
    tau_max_ms: 2000.0
    u_floor: -4                    # carried membrane floor, units of v_th
    u_ceil: null
  backbone:
    kind: merged_unet
    channels: [12, 24, 48, 48]
  heads:
    kind: v43                      # base mark / intensity heads + background head + motion features (V4-3)
    hidden: 16
    mark_prior: 0.03
    intensity_prior_per_px_step: 0.0002
    log_g_max: 8.0
    motion_channels: 16
    motion_hidden: 0                 # 0 = one 1x1 projection (dense cost 34 x 16 MAC per pixel)
    background_hidden: 8
    detach_trunk: false
  transport:
    kind: none
  motion:                          # anchors: zero + 16 directions x speed rings in octaves (px per step)
    rings_px_per_step: [0.5, 1, 2, 4, 8, 16, 32, 64]
    directions: 16
    hidden: 32
  readout_head:
    max_delay_steps: 5             # deadline D: latency budget 250 ms
    stability_hidden: 8

verifier:
  kind: tube_evidence              # V2 tube test along the top-K learned motion anchors (learned weights)
  hypotheses: 5
  mu_floor_per_px_step: 0.001      # = representation.bg_floor_per_px_step
  background: head                 # head = learned H0; front = the front end's mu0
  anchor: true

readouts:
  - kind: net
  - kind: learned_delay
    delays_steps: [1, 2, 3, 4, 5]
  - kind: learned_publish
    theta: null                    # null = logit(evaluation.threshold)
    epsilon: 0.02                  # tolerated rate of early decisions that differ from the deadline decision

loss:
  kind: v43
  train_base: true
  mark_weight: 1.0
  intensity_weight: 1.0
  intensity_smooth_px: 3
  background_weight: 1.0
  motion_weight: 1.0
  residual_weight: 1.0
  growth_weight: 1.0
  evidence_weight: 1.0
  stability_weight: 1.0
  max_queries: 16384               # events per chunk for the motion / evidence terms (targets first)

training:
  kind: tbptt
  seed: 37
  epochs: 50
  lr: 0.001
  lr_end: 0.0001
  tbptt_steps: 16
  grad_clip: 1.0
  num_workers: 2
  deterministic: true
  carry: true
  calibration:
    sequences: 8
    steps: 32
    samples_per_channel: 2048
    min_positive: 1024
    quantile: 0.99
    gain_min: 0.05
    gain_max: 20.0

evaluation:
  threshold: 0.9
  chunk_steps: 32
  frame_ms: 50
  correct_thresh: 0.0001
  select_readout: pub                # checkpoint selection by the reported readout
  select_metric: iou
