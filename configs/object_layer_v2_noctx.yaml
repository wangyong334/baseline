# 消融对照（Inn 13.68）：object_layer_v2.yaml + object_context: false（读出不看目标槽）。
#   与 object_layer_v2 唯一的差别：读出不看目标槽、不挂起；论文消融里证明增益来自目标层而不是多了一个读出头。
#   其余设置与 object_layer_v2.yaml 完全相同（有测试核对）。
# 用法（服务器）：CFG=configs/object_layer_v2_noctx.yaml GPU=? nohup bash tools/run_track_head.sh > run/object_layer_v2_noctx_all.log 2>&1 &
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  input_device: gpu
BASE:
  base_checkpoint: log/stream_tif_commpeak_inv_seed37/best_val_iou_seed37.pt   # E3a（val 最好一轮，第 42 轮）
HEAD:
  head_kind: object
  slots: 16
  hidden: 32
  attn_hidden: 32
  em_iters: 2
  defer_max: 10
  defer_alpha: 0.05
  clutter_source: background
  continuous_time: true
  object_context: false      # 对照：读出不看目标槽（检验增益来自目标）
TRAIN:
  seed: 37
  epochs: 20
  lr: 0.001
  lr_end: 0.0001
  streams: 4
  tbptt_k: 16
  stream_layout: greedy
  grad_clip: 1.0
  lambda_exist: 1.0
  lambda_pos: 0.5
  lambda_membership: 1.0
  now_loss_weight: 1.0
  lag_loss_weight: 1.0
  deterministic: true
  eval_chunk: 32
  save_root: log/object_layer_v2_noctx_seed37
EVAL:
  calibrate_existence: false
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
  gate_tail_drop: 0.30
  gate_gap_drop: 0.30
  gate_near_rise: 0.10
