# 模块三 v5：目标神经元层（model/object_layer.py；Stream-SNN-Innovations.md 13.67；train_track_head.py）。
# 10-31 用户否定 v2～v4f：跟踪的数学写成网络外的程序，常数按 EV-UAV 定，不能泛化。本层把同一套数学写成网络的结构：
#   事件 = 各目标与杂波的泊松点过程；关联（PDA）= 事件对"目标槽 + 背景槽"的注意力；
#   预测 / 校正（卡尔曼）= 槽的预测网络 + 注意力加权的 EM 校正（增益由学出的协方差按卡尔曼公式算）；
#   目标存在 = 目标神经元（膜电位 = 存在对数几率，每个事件给一次输入，漏电 = 期望事件数）；
#   Wald 序贯检验 = 神经元的发放阈值 +-A；事件跟着所属目标的发放时间终判（同一个读出按目标在判决时刻的状态重读）。
# 手设量只有下面 HEAD 里的几项：槽数（容量）、宽度、EM 迭代次数、延迟预算、alpha。
#   长度单位 = 骨干的总步长（8 px，由网络结构读出）；格子、门、出生 / 消亡阈值、匹配半径等常数全部去掉。
# 第一轮（10-31 用户定）：挂在冻结的 E3a 上训（复用缓存的骨干输出），通过后再端到端；孤儿回溯认领不做；
#   目标神经元是脉冲的（判决 = 发放），注意力先用浮点。
# 通过标准（事先定）：val IoU >= v4f 的 0.9073（test 只报一次，四个指标）；第一拍召回 >= 0.62、目标事件平均等待 <= 0.24 窗；
#   val 上确认错判率 <= alpha。
# 用法（服务器，3 号卡）：CFG=configs/object_layer_v1.yaml GPU=3 nohup bash tools/run_track_head.sh > run/object_layer_v1_all.log 2>&1 &
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  input_device: gpu
BASE:
  base_checkpoint: log/stream_tif_commpeak_inv_seed37/best_val_iou_seed37.pt   # E3a（val 最好一轮，第 42 轮）
HEAD:
  head_kind: object
  slots: 16                   # 每条流的目标槽数（容量，不是数据集统计）
  hidden: 32                  # 槽的潜在状态宽度
  attn_hidden: 32             # 注意力 / 读出的宽度
  em_iters: 2                 # 每窗的 EM（关联 - 校正）迭代次数
  defer_max: 10               # 延迟预算：终判最晚 10 窗（500 ms）
  defer_alpha: 0.05           # 允许的错判率：阈值 A = log((1 - alpha) / alpha)；检测概率上限 1 - alpha
TRAIN:
  seed: 37
  epochs: 20
  lr: 0.001
  lr_end: 0.0001
  streams: 4
  tbptt_k: 16
  stream_layout: greedy
  grad_clip: 1.0
  lambda_exist: 1.0           # 存在 BCE（匈牙利匹配后；神经元电位校准）
  lambda_pos: 0.5             # 位置 Smooth-L1（匹配上的槽，以骨干步长为单位）
  lambda_membership: 1.0      # 归属交叉熵（目标事件归匹配的槽，其余事件归背景）
  now_loss_weight: 1.0        # 零等待输出的事件 BCE
  lag_loss_weight: 1.0        # 终判输出的事件 BCE
  deterministic: true
  eval_chunk: 32
  save_root: log/object_layer_v1_seed37
EVAL:
  calibrate_existence: false  # 不做温度校准（停止规则直接用神经元电位）
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
  gate_tail_drop: 0.30
  gate_gap_drop: 0.30
  gate_near_rise: 0.10
