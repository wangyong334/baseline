# 模块三 v4.1（样本内）在 EV-Flying 上的第二阶段评估配置（只评估，不训练）：与 configs/changepoint_v41_evflying.yaml 完全相同，只把提交改成自适应。
# 用法：python -u train_track_head.py --config configs/changepoint_v41_evflying_adaptive.yaml --mode eval --device cuda:0
#   --split val|test --checkpoint log/changepoint_v41_evflying_seed37/best_val_iou_seed37.pt --tag adaptive
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/evflying_x4
  input_device: gpu
BASE:
  base_checkpoint: log/stream_tif_commpeak_msg_evflying_x4_seed37/best_val_iou_seed37.pt   # V5-EVF（第 7 轮，val 0.8388 / test 0.7353）
HEAD:
  head_kind: changepoint
  cell: 4                     # 判决格 4x4 像素
  rings: [1, 2, 4, 8]         # 位移环（格）：不动 + 4 个半径 x 8 个方向 = 33 个位移
  evidence_channels: 8
  member_hidden: 32
  defer_max: 10               # D：终判最晚 10 窗（500 ms）
  defer_alpha: 0.05           # 自适应提交的风险比 alpha / (1 - alpha)：边界 = logit tau* +- logit(1 - alpha)，即 P >= 0.851 / <= 0.0155；固定滞后时不用
  commit: adaptive            # 第二阶段：P 越过以 tau* 为中心的上界立即判 1；暂定为 1 且越过下界立即判 0；否则第 D 窗
  evidence_form: linear       # 证据 = 线性对数似然比
  fusion: mixture             # P = S m + (1 - S) b：在场门控的归属 / 后备专家（后备初始化 = V5）
  evidence_source: backbone   # 证据读骨干分数（标记泊松）
  recursion: union            # 有界递推
  factor_training: true       # 每个因子按自己的标签训练
  state: box                  # 框占据（逐格证据强、回溯强）；尾部格的低估由后备专家兜住
  footprint_radius: 3         # 足迹场半径（格，7x7 = 28 px）：盖住两个数据集目标尺寸的 p95
  presence_tolerance: 0       # 框占据本身是展开的标签，逐格监督
  raw_residual: false         # v4.1：在场证据只用 V5 的缩放似然
  expert_input: score         # v4.1：专家只读 V5 的分数（+ 极性、窗内时间）
TRAIN:
  seed: 37
  epochs: 16                  # EV-Flying：更新次数约等于 EV-UAV 的 50 轮（与 V5-EVF、v4 EVF 相同）；学习率按轮线性衰减 1e-3 -> 1e-4，按 val 挑轮次
  lr: 0.001
  lr_end: 0.0001
  streams: 4
  tbptt_k: 16
  stream_layout: greedy
  grad_clip: 1.0
  lambda_exist: 1.0           # L_pres：过滤与各滞后平滑的在场 BCE（只训练证据）
  lambda_pos: 0.0
  lambda_membership: 0.0      # 归属 m 只由 L_evt 训练
  lambda_event: 1.0           # L_evt：各滞后的事件输出 BCE（平滑在场 detach，训练 m 与后备专家）
  now_loss_weight: 0.0        # 暂定输出 = 骨干 z0，没有可训练的部分
  lag_loss_weight: 0.0        # 提交输出已在 L_evt 里训练；这里只记录数值
  lambda_dynamics: 1.0        # L_dyn：由上一窗标签占据预测这一窗（只训练出生 / 存活 / 位移核）
  dynamics_prefit_steps: 400  # 训练证据前，先按训练集标签占据对出生 / 存活 / 位移核做最大似然（有监督 HMM）
  label_init: true            # 足迹场的形状按标签初始化（之后照常学习）
  deterministic: true
  eval_chunk: 32
  save_root: log/changepoint_v41_evflying_seed37
EVAL:
  calibrate_existence: false
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
  gate_tail_drop: 0.0
  gate_gap_drop: 0.0
  gate_near_rise: 0.10
