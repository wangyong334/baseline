# 模块三 RCL v4 在 EV-Flying x4 上的泛化检验（11-03，用户：EV-Flying 不跑 4 折骨干，只在 EV-Flying 上检验 v4 是否有效，验证模块三的泛化）。
# 与 configs/changepoint_v4.yaml 同一个模型、同一组超参数、同一评测口径，按各训各测协议在 EV-Flying 上训练、测试，只改 4 项：
#   root（EV-Flying x4 数据）、base_checkpoint（V5 在 EV-Flying 上的权重 V5-EVF）、epochs、save_root。
#   epochs = 16：EV-Flying 训练集的窗数是 EV-UAV 的 3.2 倍（2520 s 对 779 s），16 轮的更新次数约等于 EV-UAV 的 50 轮，与 V5-EVF 的 16 轮相同。
#   运动先验（出生 / 存活 / 位移核）与足迹形状照常按 EV-Flying 训练集的标签拟合 / 初始化；结构量（格 4 px、位移环 1/2/4/8 格、
#   足迹半径 3 格、D = 10 窗）两个数据集都覆盖（CLAUDE.md 1.0：位移 p95 25 px < 32 px，尺寸 p95 23 px < 28 px）。
# 注意：训练用 V5-EVF 在自己训练录像上的输出（样本内，不做交叉拟合），与 EV-UAV 的 v4 一样受堆叠的样本内偏差影响（Inn 13.84），
#   所以这是偏保守的检验：超过 V5-EVF 说明模块三在第二个数据集上有效；不超过时要先看是不是这个偏差。
# 关口工具里的极密录像是 EV-UAV 的三条，对 EV-Flying 不适用（工具找不到就跳过），只看 4 项指标、第一拍与翻转。
# 用法（服务器）：CFG=configs/changepoint_v4_evflying.yaml GPU=1 nohup bash tools/run_track_head.sh > run/changepoint_v4_evflying_all.log 2>&1 &
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/evflying_x4
  input_device: gpu
BASE:
  base_checkpoint: log/stream_tif_commpeak_msg_evflying_x4_seed37/best_val_iou_seed37.pt   # V5-EVF（第 7 轮，val 0.8388 / test 0.7353）
HEAD:
  head_kind: changepoint
  cell: 4                     # 判决格 4x4 像素
  rings: [1, 2, 4, 8]         # 位移环（格）：不动 + 4 个半径 x 8 个方向 = 33 个位移
  evidence_channels: 8
  member_hidden: 32
  defer_max: 10               # D：终判最晚 10 窗（500 ms）
  defer_alpha: 0.05           # 自适应提交的风险比 alpha / (1 - alpha)：边界 = logit tau* +- logit(1 - alpha)，即 P >= 0.851 / <= 0.0155；固定滞后时不用
  commit: fixed
  evidence_form: linear       # 证据 = 线性对数似然比
  fusion: mixture             # P = S m + (1 - S) b：在场门控的归属 / 后备专家（后备初始化 = V5）
  evidence_source: backbone   # 证据读骨干分数（标记泊松）+ 原始计数残差
  recursion: union            # 有界递推
  factor_training: true       # 每个因子按自己的标签训练
  state: box                  # 框占据（逐格证据强、回溯强）；尾部格的低估由后备专家兜住
  footprint_radius: 3         # 足迹场半径（格，7x7 = 28 px）：盖住两个数据集目标尺寸的 p95
  presence_tolerance: 0       # 框占据本身是展开的标签，逐格监督
TRAIN:
  seed: 37
  epochs: 16                  # EV-Flying：更新次数约等于 EV-UAV 的 50 轮（与 V5-EVF 相同）；学习率按轮线性衰减 1e-3 -> 1e-4，按 val 挑轮次
  lr: 0.001
  lr_end: 0.0001
  streams: 4
  tbptt_k: 16
  stream_layout: greedy
  grad_clip: 1.0
  lambda_exist: 1.0           # L_pres：过滤与各滞后平滑的在场 BCE（只训练证据）
  lambda_pos: 0.0
  lambda_membership: 0.0      # 归属 m 只由 L_evt 训练（L_mem 只看标签占据格，与使用分布不一致）
  lambda_event: 1.0           # L_evt：各滞后的事件输出 BCE（平滑在场 detach，训练 m 与后备专家）
  now_loss_weight: 0.0        # 暂定输出 = 骨干 z0，没有可训练的部分
  lag_loss_weight: 0.0        # 提交输出已在 L_evt 里训练；这里只记录数值
  lambda_dynamics: 1.0        # L_dyn：由上一窗标签占据预测这一窗（只训练出生 / 存活 / 位移核）
  dynamics_prefit_steps: 400  # 训练证据前，先按训练集标签占据对出生 / 存活 / 位移核做最大似然（有监督 HMM）
  label_init: true            # 足迹场的形状按标签初始化（之后照常学习）
  deterministic: true
  eval_chunk: 32
  save_root: log/changepoint_v4_evflying_seed37
EVAL:
  calibrate_existence: false
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
  gate_tail_drop: 0.0
  gate_gap_drop: 0.0
  gate_near_rise: 0.10
