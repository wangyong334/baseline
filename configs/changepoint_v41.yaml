# 模块三 RCL v4.1（11-03，Inn 13.84）：v4 的同一个模型（回溯式变点在场 + 在场门控的专家混合），改三处，都来自本地诊断：
#   1. 训练录像的骨干输出 = 交叉拟合的样本外输出（train_outputs；堆叠泛化 Wolpert 1992 / Breiman 1996）：
#      判决层叠在冻结的 V5 上，若用 V5 在自己训练录像上的输出训练，学到的是 V5 的样本内错误——普通录像召回 0.998（val 0.991），
#      漏检里整个目标没检出的只占 15%（val 47%），极密录像召回 0.93（val 0.48）——"未来救回"在训练里几乎用不上，
#      归属专家越训越保守（本地：救回 624 -> 148、第一拍召回 0.329 -> 0.263；只读分数时降到零等待的 0.244）。
#      样本外训练（本地以 val 的一半代替）：IoU 单调上升，救回与第一拍召回保持（0.336），误压目标少得多。
#      流程：tools/run_rcl_crossfit.sh = 4 个折骨干（V5 同一配方 configs/evisseg_stream_tif_comm_peak.yaml，每个留出一折；
#      连续 5 条录像为一块，块轮流分折）-> tools/export_oof_outputs.py -> 本配置训练与评估；验证 / 测试仍用完整的 V5。
#   2. raw_residual: false：在场证据只用 V5 的缩放似然（混合 NN-HMM 的原形）。原始计数残差随背景密度漂移：训练集加入
#      极密录像后，本地第 0 轮新增误报 54,157 个（val 0.732 -> 0.231），之后又恢复，不稳健。
#   3. expert_input: score：两个专家只读 V5 的分数（+ 极性、窗内时间），不读 dec1 内部特征。骨干负责"像不像"，判决层负责
#      "时间上是否一致"；各折骨干的分数含义相同（都是缩放对数似然比，同一 q99 / 正样本权重），内部特征不通用，所以交叉拟合
#      训练的判决层只能接分数。本地：样本外训练时只读分数 0.8420、读特征 0.8433，走势相同。
# 其余（框占据、门控混合、有界递推、各因子按自己的标签、转移参数预拟合、足迹按标签初始化、50 轮、关口、第二阶段评估）与 v4 相同。
# 用法（服务器，新目录）：GPU=3 nohup bash tools/run_rcl_crossfit.sh > run/rcl_crossfit_all.log 2>&1 &
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  input_device: gpu
BASE:
  base_checkpoint: log/stream_tif_commpeak_msg_seed37/best_val_iou_seed37.pt   # V5（val 0.8668 / test 0.8766）
HEAD:
  head_kind: changepoint
  cell: 4                     # 判决格 4x4 像素
  rings: [1, 2, 4, 8]         # 位移环（格）：不动 + 4 个半径 x 8 个方向 = 33 个位移
  evidence_channels: 8
  member_hidden: 32
  defer_max: 10               # D：终判最晚 10 窗（500 ms）
  defer_alpha: 0.05           # 第二阶段的提交阈值 alpha / 1 - alpha；固定滞后时不用
  commit: fixed
  evidence_form: linear       # 证据 = 线性对数似然比
  fusion: mixture             # P = S m + (1 - S) b：在场门控的归属 / 后备专家（后备初始化 = V5）
  evidence_source: backbone   # 证据读骨干分数（标记泊松）
  recursion: union            # 有界递推
  factor_training: true       # 每个因子按自己的标签训练
  state: box                  # 框占据（逐格证据强、回溯强）；尾部格的低估由后备专家兜住
  footprint_radius: 3         # 足迹场半径（格，7x7 = 28 px）：盖住两个数据集目标尺寸的 p95
  presence_tolerance: 0       # 框占据本身是展开的标签，逐格监督
  raw_residual: false         # v4.1：在场证据只用 V5 的缩放似然
  expert_input: score         # v4.1：专家只读 V5 的分数（+ 极性、窗内时间）
TRAIN:
  seed: 37
  epochs: 50                  # 与 v2 / v4 同一训练协议（学习率按轮线性衰减 1e-3 -> 1e-4），按 val 挑轮次
  lr: 0.001
  lr_end: 0.0001
  streams: 4
  tbptt_k: 16
  stream_layout: greedy
  grad_clip: 1.0
  lambda_exist: 1.0           # L_pres：过滤与各滞后平滑的在场 BCE（只训练证据）
  lambda_pos: 0.0
  lambda_membership: 0.0      # 归属 m 只由 L_evt 训练
  lambda_event: 1.0           # L_evt：各滞后的事件输出 BCE（平滑在场 detach，训练 m 与后备专家）
  now_loss_weight: 0.0        # 暂定输出 = 骨干 z0，没有可训练的部分
  lag_loss_weight: 0.0        # 提交输出已在 L_evt 里训练；这里只记录数值
  lambda_dynamics: 1.0        # L_dyn：由上一窗标签占据预测这一窗（只训练出生 / 存活 / 位移核）
  dynamics_prefit_steps: 400  # 训练证据前，先按训练集标签占据对出生 / 存活 / 位移核做最大似然（有监督 HMM）
  label_init: true            # 足迹场的形状按标签初始化（之后照常学习）
  train_outputs: run/oof_v5_cv4_b5.pt   # v4.1：训练录像用交叉拟合的样本外骨干输出（tools/export_oof_outputs.py）
  deterministic: true
  eval_chunk: 32
  save_root: log/changepoint_v41_seed37
EVAL:
  calibrate_existence: false
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
  gate_tail_drop: 0.0
  gate_gap_drop: 0.0
  gate_near_rise: 0.10
