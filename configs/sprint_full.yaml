# SPRINT 整体模型（初步完整版，11-01 用户定；train_end2end.py；Stream-SNN-Innovations.md 13.67～13.69）：从头端到端训练 50 轮。
# SPRINT = Spiking Probability-Ratio INTegration：每一层都是"把概率比积分到界再输出"。
#   模块一 BIR：像素层的有界积分-汇报神经元 + 每窗消息峰值约束（结构与训练设置取自 backbone_config，即 E3a 的 YAML）；
#   模块二 v2：不变输入接口（enc1，按背景率做恒虚警归一化）+ 学出来的杂波强度场（model/clutter_field.py，泊松最大似然，
#              替换手写背景估计器的约 12 个常数）；
#   模块三 WON：Wald 目标神经元（model/object_layer.py）：目标槽 + PDA 注意力 + 卡尔曼式预测 / 校正（窗内连续时间，一窗量出
#              位置与速度）+ 存在对数概率比膜电位、Wald 阈值发放；事件随所属目标的发放时刻判决；杂波密度 = 同一个杂波场。
#   端到端：一个损失（像素读出 BCE + 目标层零等待 / 终判 BCE + 存在 / 归属 / 位置 + 杂波场泊松似然 + 消息约束）；
#           选择性分离：归属（哪些事件属于同一目标）回传骨干，存在证据与杂波场的输出不回传。
# 11-01 用户定的三点：杂波场替换手写估计器；选择性分离；目标层从第 0 轮就一起训。
# 手设量：槽数、宽度、EM 迭代次数、延迟预算、alpha；杂波场的漏积分器个数与时间常数初值、汇聚尺度（结构量）。
# 通过标准（事先定，PAPER-NOTES 第 13 节）：val IoU >= 0.9073；第一拍召回 >= 0.62、目标事件平均等待 <= 0.24 窗；
#   val 上确认错判率 <= alpha；每窗消息数 p95 <= 预算；杂波场的预测率与实际非目标计数一致（泊松似然逐轮下降、按录像核对）。
# 用法（服务器 3 号卡）：CFG=configs/sprint_full.yaml GPU=3 nohup bash tools/run_end2end.sh > run/sprint_full_all.log 2>&1 &
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  input_device: gpu
BACKBONE:
  backbone_config: configs/evisseg_stream_tif_comm_peak_invariant.yaml   # 模块一 + 二的结构、统计文件、校准与多流设置（E3a）
  clutter_estimator: learned   # 模块二 v2：背景率由学出来的杂波场给出（online = 原手写估计器）
HEAD:
  head_kind: object
  slots: 16
  hidden: 32
  attn_hidden: 32
  em_iters: 2
  defer_max: 10               # 延迟预算：终判最晚 10 窗（500 ms）
  defer_alpha: 0.05           # 允许的错判率：A = log((1 - alpha) / alpha)；检测概率上限 1 - alpha
  clutter_source: background  # 杂波密度 = 杂波场给出的背景率
  continuous_time: true
  separation: selective       # 归属回传骨干，存在证据不回传
TRAIN:
  seed: 37
  epochs: 50
  lr: 0.001                   # 与 E3a 相同：按轮线性降到 lr_end
  lr_end: 0.0001
  backbone_lr_scale: 1.0      # 从头训练：骨干与目标层、杂波场同一学习率
  grad_clip: 1.0
  lambda_pixel: 1.0
  now_loss_weight: 1.0
  lag_loss_weight: 1.0
  lambda_exist: 1.0
  lambda_pos: 0.5
  lambda_membership: 1.0
  lambda_clutter: 1.0         # 杂波场的泊松负对数似然
  deterministic: true
  eval_chunk: 32
  save_root: log/sprint_full_seed37
EVAL:
  calibrate_existence: false
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
  gate_tail_drop: 0.30
  gate_gap_drop: 0.30
  gate_near_rise: 0.10
