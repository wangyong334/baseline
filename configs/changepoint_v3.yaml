# 模块三 RCL v3（11-02，v2 失效诊断后的重设计，Inn 13.80）：回溯式变点标注层（model/changepoint_layer.py）挂在冻结的 V5 上。
# 【状态 11-02：本地验证暴露框占据状态的结构缺陷（尾部格被平滑误判为消失，Inn 13.80），不要在服务器上训练；
#   保留作为下一版（目标中心状态）的对照与消融。】
# v2（configs/changepoint_v2.yaml）val 0.8022 / test 0.7896，五条关口只过一条。诊断（CLAUDE.md 11.16）：
#   在场通路只读当前窗原始计数，格级检测 AUC val / test 0.90 / 0.86，V5 的输出汇到格上是 0.985 / 0.989；
#   乘积输出让这个更弱的检测器否决 V5（误压的目标 97～98% 卡在在场）。
# 相对 v2 只改三处（另加转移参数的标签最大似然预拟合），其余（骨干、编码、提交协议、乘积输出、损失权重、关口）不变：
#   evidence_source backbone（混合 NN-HMM：格内骨干分数按标记泊松叠加 sum softplus(z0 + beta) - mu，原始计数为残差）；
#   recursion union（来源内互斥求和、来源间独立求并：在场有界，多格目标不溢出；RTS 越界处光滑饱和）；
#   factor_training true（证据只由 L_pres、出生 / 存活 / 位移核只由 L_dyn、归属头由 L_mem + L_evt）；
#   dynamics_prefit_steps 400（转移参数先按标签拟合：否则位移核几千步内近乎均匀，回溯在场每往回一窗乘 ~0.03）。
# 第一阶段 = 固定滞后（commit: fixed）；关口与 v1 / v2 相同：val >= 0.8768、test 不低于 V5、普通录像不降、
# 极密录像目标附近误报 +10% 以内、第一拍召回 +0.08 以上（tools/rcl_stage1_check.py）。val 挑轮次，test 只报一次。
# 手设量：判决格 cell、位移环 rings（结构量）；D = defer_max、alpha（需求量）。没有数据集统计常数。
# 用法（服务器）：CFG=configs/changepoint_v3.yaml GPU=2 nohup bash tools/run_track_head.sh > run/changepoint_v3_all.log 2>&1 &
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  input_device: gpu
BASE:
  base_checkpoint: log/stream_tif_commpeak_msg_seed37/best_val_iou_seed37.pt   # V5（val 0.8668 / test 0.8766）
HEAD:
  head_kind: changepoint
  cell: 4                     # 判决格 4x4 像素
  rings: [1, 2, 4, 8]         # 位移环（格）：不动 + 4 个半径 x 8 个方向 = 33 个位移
  evidence_channels: 8
  member_hidden: 32
  defer_max: 10               # D：终判最晚 10 窗（500 ms）
  defer_alpha: 0.05           # 第二阶段的提交阈值 alpha / 1 - alpha；固定滞后时不用
  commit: fixed
  evidence_form: linear       # 证据 = 线性对数似然比
  fusion: product             # 事件输出 = P(s|s+D) x m（目标事件必在占据格内的恒等分解）
  evidence_source: backbone   # v3：证据读骨干分数（标记泊松）+ 原始计数残差
  recursion: union            # v3：有界递推
  factor_training: true       # v3：每个因子按自己的标签训练
TRAIN:
  seed: 37
  epochs: 50
  lr: 0.001
  lr_end: 0.0001
  streams: 4
  tbptt_k: 16
  stream_layout: greedy
  grad_clip: 1.0
  lambda_exist: 1.0           # L_pres：过滤与各滞后平滑的在场 BCE（只训练证据）
  lambda_pos: 0.0
  lambda_membership: 1.0      # L_mem：占据格内事件的归属 BCE
  lambda_event: 1.0           # L_evt：各滞后的事件输出 BCE（平滑在场 detach，只训练归属头）
  now_loss_weight: 0.0        # 暂定输出 = 骨干 z0，没有可训练的部分
  lag_loss_weight: 0.0        # 提交输出已在 L_evt 里训练；这里只记录数值
  lambda_dynamics: 1.0        # L_dyn：由上一窗标签占据预测这一窗（只训练出生 / 存活 / 位移核）
  dynamics_prefit_steps: 400  # 训练证据前，先按训练集标签占据对出生 / 存活 / 位移核做最大似然（有监督 HMM）
  deterministic: true
  eval_chunk: 32
  save_root: log/changepoint_v3_seed37
EVAL:
  calibrate_existence: false
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
  gate_tail_drop: 0.0
  gate_gap_drop: 0.0
  gate_near_rise: 0.10
