# [V9-final] 2×2 对照的 LIF 格（11-05 用户定）：V5 的结构与训练协议，只把 BIR（tif）换成 LIF（V1 的软复位 LIF，τ 可学）
# 来源：configs/final/bb_v5_50.yaml；改 neuron: lif，删 tif 小节与 TRAIN 的 comm_* 四项（通信预算只用于 tif；
# 预算 157700 本来就按同结构 LIF 每窗的平均脉冲数定），改 save_root（tests/test_final_v9.py 核对）。
# 用途：{LIF, BIR} × {逐窗读出, B2}；本骨干之后接 b2_lookahead_50（RUN=b2_lookahead_50_on_v5lif）。
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  stats_path: configs/stream_v1_train_stats.json   # 由 tools/stream_train_stats.py 生成
  window_ms: 50
  n_windows: 160
  time_bins: 5
  height: 260
  width_px: 346
  pad_height: 264          # 3 次 stride=2 下采样，对齐到 8 的倍数；只补右侧和下侧
  pad_width: 352
  input_clip: 3.0          # X = clip(log1p(C)/q99, 0, 3)

NET:
  channels: [12, 24, 48, 48]
  neuron: lif                  # 软复位 LIF（逐通道可学的 tau），与 V1 相同；其余与 V5 相同
  state_mode: carry            # carry | reset_each_window
  norm: none
  v_threshold: 1.0
  tau_init_ms: 200.0           # beta0 = exp(-50/200) ≈ 0.779
  tau_min_ms: 50.0
  tau_max_ms: 2000.0
  readout_hidden: 32

CALIB:
  calib_sequences: 8
  calib_windows: 32
  calib_samples_per_channel: 2048
  calib_min_positive: 1024
  calib_quantile: 0.99
  calib_gain_min: 0.05
  calib_gain_max: 20.0

TRAIN:
  seed: 37
  epochs: 50
  lr: 0.001
  lr_end: 0.0001               # 按 epoch 线性衰减
  tbptt_k: 16
  trainer: streams             # 标准有状态 TBPTT：B 条并行流，每 n 个片段更新一次（10-16 定稿 B=4、n=1、k=16）
  streams: 4
  accumulate: 1
  optimizer_step: per_sequence # 只对 trainer=sequence 生效
  grad_clip: 1.0
  pos_weight_cap: 30.0
  train_subset_size: 24
  num_workers: 2
  execution: layer
  input_device: gpu
  train_subset_every: 5
  eval_chunk: 32
  deterministic: true
  save_root: log/final/bb_v5lif_50_seed37
  save_epochs: true             # 逐轮权重 epochs/epoch_XXX.pt：按 val + 普通组护栏挑轮次（tools/select_checkpoint.py）

EVAL:
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
