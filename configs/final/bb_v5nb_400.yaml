# [11-08 检验①] 去掉 BIR 的消息预算：与 configs/final/bb_v5_400.yaml 只差 TRAIN 的 comm_* 四项（删去）和 save_root。
# 目的：400 ms 上 BIR 与 LIF 打平，是不是每秒消息预算在压 BIR（LIF 没有预算）。
# [V9-final] 切片长度实验 400 ms 端点（11-06 用户定：50 vs 400 ms 同时检验 BIR 与判决解耦）：V5（BIR + 每窗消息峰值约束）@ 400 ms
# 来源：configs/final/bb_v5_50.yaml；只换按窗计的量，物理量全部不变（tests/test_final_v9.py 核对）：
#   窗长 50 -> 400 ms（用户定：500 ms 除不尽，取除得尽的 400 ms）、窗数 160 -> 20（8 s 不变）；窗内 5 个时间分箱（10 -> 80 ms）；
#   TBPTT 片段 16 -> 2 窗（800 ms 不变）；验证片段 32 -> 4 窗；增益校准 32 -> 4 窗（1.6 s 不变）；
#   每窗消息预算 157700 -> 1261600（每秒预算不变）；分段按窗号除以 8；
#   只用于诊断、不影响训练与官方指标的两项向上取整：计时预热 20 -> 3 窗（1 s -> 1.2 s），滚动窗 10 -> 2；
#   输入统计 q99 按 400 ms 窗重新生成（stats_path）。tau、阈值、pd_detT = 50 ms 都是物理量，不变。
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  stats_path: configs/stream_v1_train_stats_w400.json   # 由 tools/stream_train_stats.py 生成
  window_ms: 400
  n_windows: 20
  time_bins: 5
  height: 260
  width_px: 346
  pad_height: 264          # 3 次 stride=2 下采样，对齐到 8 的倍数；只补右侧和下侧
  pad_width: 352
  input_clip: 3.0          # X = clip(log1p(C)/q99, 0, 3)

NET:
  channels: [12, 24, 48, 48]
  neuron: tif
  tif:
    levels: 7                  # D：汇报电平 0..7（3 bit），消息 Δq ∈ {-7..7}
    quantize: true             # false = 直接汇报实数 M（对照）
    k_init: 0.05               # 参考值 k 初值（softplus），单位是校准后的驱动（q99 正电流 = 1）
  state_mode: carry            # carry | reset_each_window
  norm: none
  v_threshold: 1.0             # TIF 中只决定 theta 初值 = v_threshold / levels（量程 D*theta = 1）与增益校准目标
  tau_init_ms: 200.0           # lam0 = exp(-400/200) ≈ 0.135
  tau_min_ms: 50.0
  tau_max_ms: 2000.0
  readout_hidden: 32

CALIB:
  calib_sequences: 8
  calib_windows: 4
  calib_samples_per_channel: 2048
  calib_min_positive: 1024
  calib_quantile: 0.99
  calib_gain_min: 0.05
  calib_gain_max: 20.0

TRAIN:
  seed: 37
  epochs: 50
  lr: 0.001
  lr_end: 0.0001               # 按 epoch 线性衰减
  tbptt_k: 2
  trainer: streams             # 标准有状态 TBPTT：B 条并行流，每 n 个片段更新一次（10-16 定稿 B=4、n=1、k=16）
  streams: 4
  accumulate: 1
  optimizer_step: per_sequence # 只对 trainer=sequence 生效
  grad_clip: 1.0
  pos_weight_cap: 30.0
  train_subset_size: 24
  num_workers: 2
  execution: layer
  input_device: gpu
  train_subset_every: 5
  eval_chunk: 4
  deterministic: true
  save_root: log/final/bb_v5nb_400_seed37
  save_epochs: true             # 逐轮权重 epochs/epoch_XXX.pt：按 val + 普通组护栏挑轮次（tools/select_checkpoint.py）

EVAL:
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 2
  segments: [[0, 1], [8, 9], [18, 19]]
  timing_warmup_windows: 3
