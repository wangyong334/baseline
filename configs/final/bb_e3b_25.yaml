# [V9 优化 3] 25 ms 的完整骨干：E3b @ 25 ms（模块一 + 模块二；NISI + 窄范围加噪）
# 与 configs/final/bb_v5_25.yaml 只差 NET 的 invariant_input、TRAIN 的 noise_aug_* 三项与 save_root（tests/test_v9_opt.py 核对），
# 即 bb_e3b_50 相对 bb_v5_50 的同一组差别。模块二的常数自 V9 优化起按物理单位换算（model/comod.py 的时间常数与
# 计数截断按 50 / window_ms 换窗数，参照率按 window_ms / 50 换每窗率，train_stream_v1.ref_rate_per_window），50 ms 时逐位不变。
# 加噪率按每像素每窗给出：25 ms 窗取 50 ms 的一半（0.001～0.02，即同样的 0.04～0.8 Hz/px）。
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  stats_path: configs/stream_v1_train_stats_w25.json   # 由 tools/stream_train_stats.py 生成
  window_ms: 25
  n_windows: 320
  time_bins: 5
  height: 260
  width_px: 346
  pad_height: 264          # 3 次 stride=2 下采样，对齐到 8 的倍数；只补右侧和下侧
  pad_width: 352
  input_clip: 3.0          # X = clip(log1p(C)/q99, 0, 3)

NET:
  channels: [12, 24, 48, 48]
  neuron: tif
  tif:
    levels: 7                  # D：汇报电平 0..7（3 bit），消息 Δq ∈ {-7..7}
    quantize: true             # false = 直接汇报实数 M（对照）
    k_init: 0.05               # 参考值 k 初值（softplus），单位是校准后的驱动（q99 正电流 = 1）
  state_mode: carry            # carry | reset_each_window
  norm: none
  v_threshold: 1.0             # TIF 中只决定 theta 初值 = v_threshold / levels（量程 D*theta = 1）与增益校准目标
  tau_init_ms: 200.0           # lam0 = exp(-50/200) ≈ 0.779
  tau_min_ms: 50.0
  tau_max_ms: 2000.0
  readout_hidden: 32
  invariant_input: true        # 模块二：enc1 不变输入接口（model/noise_invariant.py）

CALIB:
  calib_sequences: 8
  calib_windows: 64
  calib_samples_per_channel: 2048
  calib_min_positive: 1024
  calib_quantile: 0.99
  calib_gain_min: 0.05
  calib_gain_max: 20.0

TRAIN:
  seed: 37
  epochs: 50
  lr: 0.001
  lr_end: 0.0001               # 按 epoch 线性衰减
  tbptt_k: 32
  trainer: streams             # 标准有状态 TBPTT：B 条并行流，每 n 个片段更新一次（10-16 定稿 B=4、n=1、k=16）
  streams: 4
  stream_groups: 2             # 显存分组：k=32 时 4 条流一起反传超出 24 GB；分 2 组依次反传，梯度与不分组相同
  accumulate: 1
  optimizer_step: per_sequence # 只对 trainer=sequence 生效
  grad_clip: 1.0
  comm_budget_messages: 78850.0   # 每窗消息数上限 = 50 ms 版预算 157700 的一半（每秒预算不变）
  comm_dual_lr: 0.01            # 乘子 mu 的对偶上升步长（每次参数更新）
  comm_budget_mode: peak        # 每窗峰值约束（机会约束）；平均预算 mean 已删除（12.32）
  comm_peak_alpha: 0.05         # 允许超出预算的窗口比例：每窗消息数的第 95 百分位不超过 LIF 的平均脉冲数
  pos_weight_cap: 30.0
  train_subset_size: 24
  num_workers: 2
  execution: layer
  input_device: gpu
  train_subset_every: 5
  eval_chunk: 64
  deterministic: true
  noise_aug_prob: 0.5           # 每条训练录像加噪的概率（同 E3b）
  noise_aug_rate_min: 0.001     # 每像素每 25 ms 窗 = 0.04 Hz/px（50 ms 版 0.002）
  noise_aug_rate_max: 0.02      # 每像素每 25 ms 窗 = 0.8 Hz/px（50 ms 版 0.04）
  save_root: log/final/bb_e3b_25_seed37
  save_epochs: true             # 逐轮权重 epochs/epoch_XXX.pt：按 val + 普通组护栏挑轮次（tools/select_checkpoint.py）

EVAL:
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 20
  segments: [[0, 31], [128, 159], [288, 319]]
  timing_warmup_windows: 40
