# [V9-final] B2 + 占据监督：与 b2_lookahead_50.yaml 只差 occupancy_aux、lambda_exist、save_root（tests/test_final_v9.py 核对）。
#   回溯状态再接一个 1x1 卷积的在场读出，用与 RCL 的 L_pres 相同的框占据标签在每个滞后上监督（多任务辅助损失），
#   于是 B2 与 RCL 之间只剩"模型驱动的递推结构"（按标签拟合的 HMM 转移 + RTS 平滑 + 在场门控专家）这一处差别。
#   两边都只读 V5 分数（格内标记泊松图 + 事件的 p、窗内时间、V5 校准 logit），同未来预算（D = 10 窗 = 500 ms）、同提交规则
#   （固定 D / 以 tau* 为中心的自适应边界）、同训练协议（冻结 V5 的样本内输出，50 轮，lr 1e-3 -> 1e-4，4 流，k = 16，
#   各滞后的事件 BCE）；容量相近（B2 1577 个参数，RCL 只读分数 577 / 读特征 1345）。
#   B2 没有 RCL 的模型部件：没有在场状态、没有按标签拟合的转移、没有占据监督、没有门控与专家混合；有残差回退（初始化 = V5）
#   与多滞后训练（审阅 11.28）。用途：检验"模型驱动的在场回溯"这一结构是否必要（PAPER_PLAN v2 §4.4、FINAL_PLAN §4）。
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  input_device: gpu
BASE:
  base_checkpoint: log/stream_tif_commpeak_msg_seed37/best_val_iou_seed37.pt   # V5（与 rcl_score_50 的现有权重同一骨干）
HEAD:
  head_kind: lookahead
  cell: 4                     # 与 RCL 相同的判决格
  defer_max: 10
  defer_alpha: 0.05
  commit: fixed
  lookahead_hidden: 3         # 编码 / 前向 / 后向 ConvGRU 的通道数
  member_hidden: 16           # 读出 MLP 的隐层
  occupancy_aux: true         # 框占据辅助监督（与 RCL 的 L_pres 同一标签）
TRAIN:
  seed: 37
  epochs: 50
  lr: 0.001
  lr_end: 0.0001
  streams: 4
  tbptt_k: 16
  stream_layout: greedy
  grad_clip: 1.0
  lambda_exist: 1.0           # 辅助占据损失的权重（与 RCL 的 L_pres 相同）
  lambda_pos: 0.0
  lambda_membership: 0.0
  lambda_event: 1.0           # 唯一的损失：各滞后的事件输出 BCE（= RCL 的 L_evt）
  now_loss_weight: 0.0
  lag_loss_weight: 0.0
  lambda_dynamics: 0.0
  dynamics_prefit_steps: 0
  label_init: false
  deterministic: true
  eval_chunk: 32
  save_root: log/final/b2_lookahead_occ_50_seed37
  save_epochs: true
EVAL:
  calibrate_existence: false
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
  gate_tail_drop: 0.0
  gate_gap_drop: 0.0
  gate_near_rise: 0.10
