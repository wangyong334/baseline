# [11-08 主表候选] 去掉 BIR 的消息预算 @ 50 ms：与 configs/final/bb_v5_50.yaml 只差 TRAIN 的 comm_* 四项（删去）和 save_root。
# 依据：400 ms 三种子上，去掉预算后骨干变差（test 0.8525 -> 0.8264），但加判决层后最好（test 0.8941 -> 0.9019，val 0.8907 -> 0.9275）。
# [V9-final] 模块一 V5（BIR + 每窗消息峰值约束）
# 来源：configs/evisseg_stream_tif_comm_peak.yaml；只改 save_root、加 save_epochs（tests/test_final_v9.py 核对）。
# V5 BIR（tif）+ 通信预算训练：每窗消息数的峰值约束（Stream-SNN-Innovations.md 12.21、12.35）：每个窗、每条流发出的消息数超过预算的比例 <= alpha
# 约束量与能耗口径无关，能耗只在评估环节计算。除 TRAIN 的 comm_* 四项与 save_root 外与 evisseg_stream_tif_notransport.yaml 相同
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  stats_path: configs/stream_v1_train_stats.json   # 由 tools/stream_train_stats.py 生成
  window_ms: 50
  n_windows: 160
  time_bins: 5
  height: 260
  width_px: 346
  pad_height: 264          # 3 次 stride=2 下采样，对齐到 8 的倍数；只补右侧和下侧
  pad_width: 352
  input_clip: 3.0          # X = clip(log1p(C)/q99, 0, 3)

NET:
  channels: [12, 24, 48, 48]
  neuron: tif
  tif:
    levels: 7                  # D：汇报电平 0..7（3 bit），消息 Δq ∈ {-7..7}
    quantize: true             # false = 直接汇报实数 M（对照）
    k_init: 0.05               # 参考值 k 初值（softplus），单位是校准后的驱动（q99 正电流 = 1）
  state_mode: carry            # carry | reset_each_window
  norm: none
  v_threshold: 1.0             # TIF 中只决定 theta 初值 = v_threshold / levels（量程 D*theta = 1）与增益校准目标
  tau_init_ms: 200.0           # lam0 = exp(-50/200) ≈ 0.779
  tau_min_ms: 50.0
  tau_max_ms: 2000.0
  readout_hidden: 32

CALIB:
  calib_sequences: 8
  calib_windows: 32
  calib_samples_per_channel: 2048
  calib_min_positive: 1024
  calib_quantile: 0.99
  calib_gain_min: 0.05
  calib_gain_max: 20.0

TRAIN:
  seed: 37
  epochs: 50
  lr: 0.001
  lr_end: 0.0001               # 按 epoch 线性衰减
  tbptt_k: 16
  trainer: streams             # 标准有状态 TBPTT：B 条并行流，每 n 个片段更新一次（10-16 定稿 B=4、n=1、k=16）
  streams: 4
  accumulate: 1
  optimizer_step: per_sequence # 只对 trainer=sequence 生效
  grad_clip: 1.0
  pos_weight_cap: 30.0
  train_subset_size: 24
  num_workers: 2
  execution: layer
  input_device: gpu
  train_subset_every: 5
  eval_chunk: 32
  deterministic: true
  save_root: log/final/bb_v5nb_50_seed37
  save_epochs: true             # 逐轮权重 epochs/epoch_XXX.pt：按 val + 普通组护栏挑轮次（tools/select_checkpoint.py）

EVAL:
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
