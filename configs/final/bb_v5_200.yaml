# [V9-final] 切片长度实验（11-06 用户定）：V5（BIR + 每窗消息峰值约束）@ 200 ms
# 来源：configs/final/bb_v5_50.yaml；只换按窗计的量，物理量全部不变（tests/test_final_v9.py 核对）：
#   窗长 50 -> 200 ms、窗数 160 -> 40（8 s 不变）；窗内 5 个时间分箱（10 -> 40 ms）；
#   TBPTT 片段 16 -> 4 窗（800 ms 不变）；验证片段 32 -> 8 窗；增益校准 32 -> 8 窗（1.6 s 不变）；
#   每窗消息预算 157700 -> 630800（每秒预算不变）；分段与计时预热按窗号除以 4；
#   滚动窗 10 -> 3（只用于评估输出里的滚动 IoU 曲线，不影响官方指标；10/4 不是整数，取 600 ms）；
#   输入统计 q99 按 200 ms 窗重新生成（stats_path）。tau、阈值、pd_detT = 50 ms 都是物理量，不变。
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  stats_path: configs/stream_v1_train_stats_w200.json   # 由 tools/stream_train_stats.py 生成
  window_ms: 200
  n_windows: 40
  time_bins: 5
  height: 260
  width_px: 346
  pad_height: 264          # 3 次 stride=2 下采样，对齐到 8 的倍数；只补右侧和下侧
  pad_width: 352
  input_clip: 3.0          # X = clip(log1p(C)/q99, 0, 3)

NET:
  channels: [12, 24, 48, 48]
  neuron: tif
  tif:
    levels: 7                  # D：汇报电平 0..7（3 bit），消息 Δq ∈ {-7..7}
    quantize: true             # false = 直接汇报实数 M（对照）
    k_init: 0.05               # 参考值 k 初值（softplus），单位是校准后的驱动（q99 正电流 = 1）
  state_mode: carry            # carry | reset_each_window
  norm: none
  v_threshold: 1.0             # TIF 中只决定 theta 初值 = v_threshold / levels（量程 D*theta = 1）与增益校准目标
  tau_init_ms: 200.0           # lam0 = exp(-200/200) ≈ 0.368
  tau_min_ms: 50.0
  tau_max_ms: 2000.0
  readout_hidden: 32

CALIB:
  calib_sequences: 8
  calib_windows: 8
  calib_samples_per_channel: 2048
  calib_min_positive: 1024
  calib_quantile: 0.99
  calib_gain_min: 0.05
  calib_gain_max: 20.0

TRAIN:
  seed: 37
  epochs: 50
  lr: 0.001
  lr_end: 0.0001               # 按 epoch 线性衰减
  tbptt_k: 4
  trainer: streams             # 标准有状态 TBPTT：B 条并行流，每 n 个片段更新一次（10-16 定稿 B=4、n=1、k=16）
  streams: 4
  accumulate: 1
  optimizer_step: per_sequence # 只对 trainer=sequence 生效
  grad_clip: 1.0
  comm_budget_messages: 630800.0  # 每窗消息数上限 = 50 ms 版预算 157700 的四倍（每秒预算不变）
  comm_dual_lr: 0.01            # 乘子 mu 的对偶上升步长（每次参数更新）
  comm_budget_mode: peak        # 每窗峰值约束（机会约束）；平均预算 mean 已删除（12.32）
  comm_peak_alpha: 0.05         # 允许超出预算的窗口比例：每窗消息数的第 95 百分位不超过 LIF 的平均脉冲数
  pos_weight_cap: 30.0
  train_subset_size: 24
  num_workers: 2
  execution: layer
  input_device: gpu
  train_subset_every: 5
  eval_chunk: 8
  deterministic: true
  save_root: log/final/bb_v5_200_seed37
  save_epochs: true             # 逐轮权重 epochs/epoch_XXX.pt：按 val + 普通组护栏挑轮次（tools/select_checkpoint.py）

EVAL:
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 3
  segments: [[0, 3], [16, 19], [36, 39]]
  timing_warmup_windows: 5
