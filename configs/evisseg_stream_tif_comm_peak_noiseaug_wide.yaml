# E1w（Inn 13.55，对照）：E1 噪声增强，范围放宽到 L <= 3；没有不变接口。回答"E3 的外推优势是否只因为增强范围窄"。
# 除 noise_aug_rate_max 与 save_root 外，与 evisseg_stream_tif_comm_peak_noiseaug.yaml 逐项相同（有测试核对）。
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  stats_path: configs/stream_v1_train_stats.json   # 由 tools/stream_train_stats.py 生成
  window_ms: 50
  n_windows: 160
  time_bins: 5
  height: 260
  width_px: 346
  pad_height: 264          # 3 次 stride=2 下采样，对齐到 8 的倍数；只补右侧和下侧
  pad_width: 352
  input_clip: 3.0          # X = clip(log1p(C)/q99, 0, 3)

NET:
  channels: [12, 24, 48, 48]
  neuron: tif
  tif:
    levels: 7                  # D：汇报电平 0..7（3 bit），消息 Δq ∈ {-7..7}
    quantize: true             # false = 直接汇报实数 M（对照）
    k_init: 0.05               # 参考值 k 初值（softplus），单位是校准后的驱动（q99 正电流 = 1）
  state_mode: carry            # carry | reset_each_window
  norm: none
  v_threshold: 1.0             # TIF 中只决定 theta 初值 = v_threshold / levels（量程 D*theta = 1）与增益校准目标
  tau_init_ms: 200.0           # lam0 = exp(-50/200) ≈ 0.779
  tau_min_ms: 50.0
  tau_max_ms: 2000.0
  readout_hidden: 32

CALIB:
  calib_sequences: 8
  calib_windows: 32
  calib_samples_per_channel: 2048
  calib_min_positive: 1024
  calib_quantile: 0.99
  calib_gain_min: 0.05
  calib_gain_max: 20.0

TRAIN:
  seed: 37
  epochs: 50
  lr: 0.001
  lr_end: 0.0001               # 按 epoch 线性衰减
  tbptt_k: 16
  trainer: streams             # 标准有状态 TBPTT：B 条并行流，每 n 个片段更新一次（10-16 定稿 B=4、n=1、k=16）
  streams: 4
  accumulate: 1
  optimizer_step: per_sequence # 只对 trainer=sequence 生效
  grad_clip: 1.0
  comm_budget_messages: 157700.0  # 每窗消息数上限 = V1（LIF）在 EV-UAV val 上每窗发出的平均脉冲数 157734（enc1~dec2）
  comm_dual_lr: 0.01            # 乘子 mu 的对偶上升步长（每次参数更新）
  comm_budget_mode: peak        # 每窗峰值约束（机会约束）；平均预算 mean 已删除（12.32）
  comm_peak_alpha: 0.05         # 允许超出预算的窗口比例：每窗消息数的第 95 百分位不超过 LIF 的平均脉冲数
  pos_weight_cap: 30.0
  train_subset_size: 24
  num_workers: 2
  execution: layer
  input_device: gpu
  train_subset_every: 5
  eval_chunk: 32
  deterministic: true
  noise_aug_prob: 0.5           # 每条训练录像加噪的概率
  noise_aug_rate_min: 0.002     # 总噪声率下限（每像素每窗）= 训练集逐序列背景率中位数（Inn 13.45）
  noise_aug_rate_max: 0.12      # 宽范围：随机巧合负荷 L <= 3（Inn 13.55；E1 / E3b 为 L <= 1）
  save_root: log/stream_tif_commpeak_noiseaug_wide_seed37

EVAL:
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
