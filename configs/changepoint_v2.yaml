# 模块三 RCL v2（第一阶段诊断后的修正，CLAUDE.md 1.0.0）：回溯式变点标注层（model/changepoint_layer.py）挂在冻结的 V5 上。
# 相对 v1（configs/changepoint_v1.yaml，第一阶段 val 0.8723 / test 0.8817，五条关口过三条）只改三处：
#   evidence_form linear（证据 = 线性对数似然比；v1 的 log(1+g) 最多 2.4 nats，目标格在场平均只有 0.06～0.10）；
#   fusion product（事件输出 = 平滑在场 x 归属；v1 以 V5 的 p0 为先验，第一拍离阈值 7.65 nats，救不回）；
#   lambda_dynamics 1（出生 / 存活 / 位移核直接拟合标签上的占据转移；v1 位移核学成均匀，不动 0.05，标签 0.38）。
# 关口与 v1 相同（下面五条），val 挑轮次、test 只报一次；轮数按用户要求 50。
# 第一阶段 = 固定滞后（commit: fixed，每个事件在第 s+D 窗提交 1[P >= tau*]）；第二阶段把 commit 改成 adaptive。
# val 挑轮次，test 只报一次。第一阶段关口（方案 §8）：val >= 0.8768、test 不低于 V5、正常序列不降、
# 密集序列目标附近误报 +10% 以内、首拍召回 +0.08 以上；不过关就停，模块三转为分析。
# 下面 gate_* 只是训练日志里的粗查（尾部 / 缺口不设要求 = IoU 不降 + 目标附近误报 <= +10%），正式判定看上面五条。
# 手设量：判决格 cell、位移环 rings（结构量）；D = defer_max、alpha（需求量）。没有数据集统计常数。
# 用法（服务器）：CFG=configs/changepoint_v2.yaml GPU=2 nohup bash tools/run_track_head.sh > run/changepoint_v2_all.log 2>&1 &
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  input_device: gpu
BASE:
  base_checkpoint: log/stream_tif_commpeak_msg_seed37/best_val_iou_seed37.pt   # V5（val 0.8668 / test 0.8766）
HEAD:
  head_kind: changepoint
  cell: 4                     # 判决格 4x4 像素
  rings: [1, 2, 4, 8]         # 位移环（格）：不动 + 4 个半径 x 8 个方向 = 33 个位移
  evidence_channels: 8
  member_hidden: 32
  defer_max: 10               # D：终判最晚 10 窗（500 ms）
  defer_alpha: 0.05           # 第二阶段的提交阈值 alpha / 1 - alpha；固定滞后时不用
  commit: fixed
  evidence_form: linear       # 证据 = 线性对数似然比 g - mu
  fusion: product             # 事件输出 = P(s|s+D) x m（目标事件必在占据格内的恒等分解）
TRAIN:
  seed: 37
  epochs: 50
  lr: 0.001
  lr_end: 0.0001
  streams: 4
  tbptt_k: 16
  stream_layout: greedy
  grad_clip: 1.0
  lambda_exist: 1.0           # L_pres：过滤与各滞后平滑的在场 BCE
  lambda_pos: 0.0
  lambda_membership: 1.0      # L_mem：占据格内事件的归属 BCE
  lambda_event: 1.0           # L_evt：各滞后的事件输出 BCE（在场与归属都回传）
  now_loss_weight: 0.0        # 暂定输出 = 骨干 z0，没有可训练的部分
  lag_loss_weight: 0.0        # 提交输出已在 L_evt 里训练；这里只记录数值
  lambda_dynamics: 1.0        # L_dyn：由上一窗标签占据预测这一窗（只训练出生 / 存活 / 位移核）
  deterministic: true
  eval_chunk: 32
  save_root: log/changepoint_v2_seed37
EVAL:
  calibrate_existence: false
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
  gate_tail_drop: 0.0
  gate_gap_drop: 0.0
  gate_near_rise: 0.10
