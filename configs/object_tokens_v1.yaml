# 模块三 v6：目标 token 层（网络写法，model/object_tokens.py；Inn 13.71）挂在冻结的 E3a 上（train_track_head.py）。
# 11-01 用户定：只重写模块三；Wald 阈值由 alpha 给出、不学。协议与 object_layer_v2.yaml / track_head_v4f.yaml 相同，只换模块，
# 直接和 v4f（test 0.8874）、v5 手写版比。
# 手设量：槽数、每窗提议数、宽度、迭代次数（架构量）；alpha、defer_max（需求量）。没有数据集统计常数。
# 用法（服务器）：CFG=configs/object_tokens_v1.yaml GPU=3 nohup bash tools/run_track_head.sh > run/object_tokens_v1_all.log 2>&1 &
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  input_device: gpu
BASE:
  base_checkpoint: log/stream_tif_commpeak_inv_seed37/best_val_iou_seed37.pt   # E3a（val 最好一轮，第 42 轮）
HEAD:
  head_kind: tokens
  slots: 16
  proposals: 4                # 每窗每条流最多提议几个候选 token
  hidden: 32
  attn_hidden: 32
  iters: 2                    # 关联 + 校正展开几次
  defer_max: 10               # 延迟预算：终判最晚 10 窗（500 ms）
  defer_alpha: 0.05           # 允许的错判率：A = log((1 - alpha) / alpha)，不学
  clutter_source: background  # 背景 logit 另读模块二的本地背景率
  separation: selective       # 冻结骨干时不起作用；与端到端配置保持一致
TRAIN:
  seed: 37
  epochs: 20
  lr: 0.001
  lr_end: 0.0001
  streams: 4
  tbptt_k: 16
  stream_layout: greedy
  grad_clip: 1.0
  lambda_exist: 1.0
  lambda_pos: 0.5
  lambda_membership: 1.0
  now_loss_weight: 1.0
  lag_loss_weight: 1.0
  deterministic: true
  eval_chunk: 32
  save_root: log/object_tokens_v1_seed37
EVAL:
  calibrate_existence: false
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
  gate_tail_drop: 0.30
  gate_gap_drop: 0.30
  gate_near_rise: 0.10
