# SPRINT 整体模型 v6（11-01）：与 sprint_full.yaml 只差模块三——手写滤波程序（v5 WON）换成目标 token 层（网络写法，
# model/object_tokens.py；Inn 13.71）。train_end2end.py 从头端到端训练 50 轮。
#   模块一 BIR + 每窗消息峰值约束（结构与训练设置取自 backbone_config，即 E3a 的 YAML）；
#   模块二 v2：不变输入接口 + 学出来的杂波强度场（model/clutter_field.py）；
#   模块三 v6：目标 token 层：交叉注意力（背景 token + 槽）、GRU 校正、槽间自注意力、学出的提议、每个槽一个脉冲神经元
#              （膜电位 = 存在对数几率，越过 Wald 界 +-A 发放；alpha 是需求量、不学）。
#   损失 = 像素 BCE + 目标层零等待 / 终判 BCE + 存在 / 归属 / 位置 + 杂波场泊松似然 + 消息约束（mu 从 0）；
#   选择性分离：归属回传骨干，存在 / 位置不回传。
# 先跑冻结版 configs/object_tokens_v1.yaml 看模块本身，再跑本配置。
# 用法（服务器）：CFG=configs/sprint_tokens.yaml GPU=3 nohup bash tools/run_end2end.sh > run/sprint_tokens_all.log 2>&1 &
DATA:
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  input_device: gpu
BACKBONE:
  backbone_config: configs/evisseg_stream_tif_comm_peak_invariant.yaml   # 模块一 + 二的结构、统计文件、校准与多流设置（E3a）
  clutter_estimator: learned   # 模块二 v2：背景率由学出来的杂波场给出
HEAD:
  head_kind: tokens
  slots: 16
  proposals: 4
  hidden: 32
  attn_hidden: 32
  iters: 2
  defer_max: 10
  defer_alpha: 0.05
  clutter_source: background
  separation: selective
TRAIN:
  seed: 37
  epochs: 50
  lr: 0.001
  lr_end: 0.0001
  backbone_lr_scale: 1.0
  grad_clip: 1.0
  lambda_pixel: 1.0
  now_loss_weight: 1.0
  lag_loss_weight: 1.0
  lambda_exist: 1.0
  lambda_pos: 0.5
  lambda_membership: 1.0
  lambda_clutter: 1.0
  deterministic: true
  eval_chunk: 32
  save_root: log/sprint_tokens_seed37
EVAL:
  calibrate_existence: false
  threshold: 0.9
  pd_detT: 50
  correct_thresh: 0.0001
  rolling_window: 10
  segments: [[0, 15], [64, 79], [144, 159]]
  timing_warmup_windows: 20
  gate_tail_drop: 0.30
  gate_gap_drop: 0.30
  gate_near_rise: 0.10
