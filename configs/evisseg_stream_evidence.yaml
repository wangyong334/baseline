# v6-2：V2-1 判决层 + V3 发布层接到冻结的 V5 骨干上（检验"之前的方案在 V5 上是否还有效"），EV-UAV
# 第一轮：骨干 = V5 定型版（BIR + 每窗消息数的峰值约束），冻结；只训练 V2 的两个逐像素头（mark、log_g）。
# 下面判决层 / 发布层 / 背景的常数与 v3 分支 configs/evisseg_stream_v3.yaml 相同；位置级告警不接，只报四个指标。
EVIDENCE:
  base_config: configs/evisseg_stream_tif_comm_peak.yaml
  backbone_checkpoint: log/stream_tif_commpeak_msg_seed37/best_val_iou_seed37.pt
  evidence_backbone: frozen             # frozen 冻结 V5、只训练两个头 | joint 骨干与头一起从头训练
  evidence_input: frame                # frame V5 的 12 通道 | frontend V2 证据前端（只能配 joint）
  # 两个头（v3 NET 节）
  head_hidden: 16                      # 逐像素头的隐藏通道
  mark_prior: 0.03                     # mark 头偏置初值 = logit(目标事件先验占比)
  intensity_prior: 0.0002              # 强度头偏置初值 = log(每像素每窗目标事件数先验)
  log_g_max: 8.0
  loss_mark_weight: 1.0                # 逐事件 BCE（无 pos_weight）
  loss_intensity_weight: 1.0           # 当前窗目标强度场的泊松负对数似然
  loss_intensity_smooth: 3             # 目标计数先在 3x3 邻域内平均成强度场
  # 背景强度 mu0（v3 FRONTEND 节；只给判决层当背景基准，不作网络输入）
  bg_fast_ms: 500                      # 快速估计（取 15x15 邻域平均，跟随成片杂波）
  bg_slow_ms: 5000                     # 慢速逐像素估计（热像素、常亮闪烁）
  bg_prior: 0.01                       # 背景先验：每像素每窗期望事件数
  bg_prior_windows: 2                  # 先验的伪窗数
  bg_floor: 0.001                      # mu0 下限
  bg_smooth_radius: 7
  # 漂移 CUSUM 判决层（v3 CUSUM 节）
  cusum_axis_velocities: [-4, -2, -1, 0, 1, 2, 4]   # 像素/窗，二维网格 7x7 = 49 个假设
  cusum_footprint: 3
  cusum_compensator: poisson
  cusum_nb_kappa: null
  cusum_aggregate: lme                 # 足迹内证据聚合：对像素间任意相关都成立
  cusum_track_tau_ms: 250              # 管道强度记忆的时间常数
  cusum_memory_gain: 1.0               # 非对称记忆 λ（1 = 原实现）
  cusum_gate_eps: 0.03                 # 预测门控 ε（V2 定稿默认）
  readout_delays: [1, 2, 3, 4, 5]      # fused_d 的固定等待窗数
  fusion_weight: 1.0                   # 融合分数 = mark + w * F(d)
  # V3 发布层（v3 PUBLISH 节；θ = logit(threshold)）
  publish_deadline: 5                  # 最长等待 D（窗）
  publish_upper: 1.0                   # 提前发布目标所需的裕量 a（nat）
  publish_lower: 2.0                   # 提前发布背景所需的裕量 b（nat）
  publish_collapse: linear             # 边界随年龄线性收拢到 θ
  publish_gate: null                   # 不门控
  publish_anchor: true                 # 锚定证据链
  # 训练（只训练两个头；多流排布与 V5 相同；轮数规则同 B1：约 5000 次更新）
  evidence_epochs: 20
  evidence_lr: 0.001
  evidence_lr_end: 0.0001              # 按 epoch 线性衰减
  evidence_grad_clip: 1.0
  evidence_streams: 4
  evidence_chunk: 16
  evidence_eval_chunk: 32              # 训练中验证（逐片段执行）每次处理的窗数
  evidence_save_root: log/stream_evidence_v23_seed37
