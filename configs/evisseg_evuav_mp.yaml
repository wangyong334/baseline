# Separate experimental configuration. Original YAML and train.py are unchanged.
STRUCTURE:
  model_name: evissgnet
  width: 12
  block_residual: True
  block_reps: 2
  use_coords: True
DATA:
  input_channel: 4
  root: /media/stephen/nvme0n1/wy_data/datasets/EV-UAV-dataset
  whole_t: 8000
  res: [346, 260]
TRAIN:
  epochs: 50
  batch_size: 1
  train_workers: 0
  optim: Adam
  lr: 0.001
  k: 3
  t: 5
  max_events_num: 700000
  model_save_root: log/model_mp_fp32_split2_seed37
TEST:
  vis: False
  eval: True
  roc: True
  pd_detT: 50
  correct_thresh: 0.0001
  save: True
  model_path: log/model_mp_fp32_split2_seed37/best_iou_seed37.pt
